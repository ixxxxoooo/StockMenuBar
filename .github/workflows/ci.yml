name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 同时覆盖旧工具链(macOS 15 / Xcode 16,走降级样式)与新工具链(macOS 26,走 Liquid Glass)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成工程
        run: xcodegen generate
      - name: 构建与测试
        run: |
          xcodebuild test \
            -scheme StockMenuBar \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  # 预演打包,避免发版时才发现打包脚本损坏
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 打包预演
        run: scripts/package.sh 0.0.0-ci 1
